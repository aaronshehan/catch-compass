# Deployment configuration. Activated with SPRING_PROFILES_ACTIVE=prod so that
# local development keeps working unchanged.
#
# No credentials live in this file. Every value comes from the environment,
# which is what keeps them out of source control.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Photos go on a mounted volume, not the container filesystem. Without a volume
# mounted here, every redeploy silently discards them.
catchcompass.storage.photo-directory=${PHOTO_DIRECTORY:/data/photos}

# There is no compose.yaml in the image, but disable this explicitly rather
# than relying on that.
spring.docker.compose.enabled=false

# The platform terminates HTTPS and forwards plain HTTP, so trust the
# X-Forwarded-Proto header when generating redirect URLs.
server.forward-headers-strategy=framework
