<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add a lure</title>
</head>
<body>

<p><a th:href="@{/lures}">Back to tackle box</a></p>

<h1>Add a lure</h1>

<form th:action="@{/lures}" th:object="${lureForm}" method="post">

    <p>
        <label for="lureType">Type</label><br>
        <select id="lureType" th:field="*{lureType}">
            <option value="">Choose a type</option>
            <option th:each="type : ${lureTypes}" th:value="${type}" th:text="${type}">type</option>
        </select>
        <span th:if="${#fields.hasErrors('lureType')}" th:errors="*{lureType}">error</span>
    </p>

    <p>
        <label for="brand">Brand</label><br>
        <input type="text" id="brand" th:field="*{brand}">
        <span th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}">error</span>
    </p>

    <p>
        <label for="model">Model</label><br>
        <input type="text" id="model" th:field="*{model}">
        <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}">error</span>
    </p>

    <p>
        <label for="color">Colour</label><br>
        <input type="text" id="color" th:field="*{color}">
        <span th:if="${#fields.hasErrors('color')}" th:errors="*{color}">error</span>
    </p>

    <p>
        <label for="size">Size</label><br>
        <input type="text" id="size" th:field="*{size}" placeholder="e.g. 3 inch, #4">
        <span th:if="${#fields.hasErrors('size')}" th:errors="*{size}">error</span>
    </p>

    <p>
        <label for="weightGrams">Weight (g)</label><br>
        <input type="number" step="0.01" id="weightGrams" th:field="*{weightGrams}">
        <span th:if="${#fields.hasErrors('weightGrams')}" th:errors="*{weightGrams}">error</span>
    </p>

    <p>
        <label for="presentation">Presentation</label><br>
        <select id="presentation" th:field="*{presentation}">
            <option value="">Not specified</option>
            <option th:each="p : ${presentations}" th:value="${p}" th:text="${p}">presentation</option>
        </select>
    </p>

    <p>
        <label for="notes">Notes</label><br>
        <textarea id="notes" rows="3" cols="40" th:field="*{notes}"></textarea>
        <span th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">error</span>
    </p>

    <p><button type="submit">Save lure</button></p>

</form>

</body>
</html>
