<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main}, ~{})}">
<head>
    <title>Catch journal</title>
</head>
<body>

<main>
    <h1>Catch journal</h1>

    <div class="actions">
        <a class="button button--primary" th:href="@{/catches/new}">Log a catch</a>
        <a class="button" th:href="@{/lures}">Tackle box</a>
    </div>

    <p class="empty" th:if="${catches.isEmpty()}">
        No catches logged yet.
    </p>

    <ul class="catch-list" th:unless="${catches.isEmpty()}">
        <li th:each="entry : ${catches}">
            <a class="catch-card" th:href="@{/catches/{id}(id=${entry.id})}">

                <img class="catch-card__thumb"
                     th:if="${catchIdsWithPhotos.contains(entry.id)}"
                     th:src="@{/catches/{id}/photo(id=${entry.id})}"
                     alt="">
                <span class="catch-card__thumb catch-card__thumb--empty"
                      th:unless="${catchIdsWithPhotos.contains(entry.id)}"
                      aria-hidden="true">&#9679;</span>

                <span class="catch-card__body">
                    <span class="catch-card__title" th:text="${entry.species.commonName}">Species</span>
                    <span class="catch-card__meta">
                        <span th:text="${@formats.dateTime(entry.caughtAt)}">date</span>
                        <span th:if="${entry.weightKg != null}"
                              th:text="' - ' + ${entry.weightKg} + ' kg'"></span>
                        <span th:if="${entry.lengthCm != null}"
                              th:text="' - ' + ${entry.lengthCm} + ' cm'"></span>
                    </span>
                </span>
            </a>
        </li>
    </ul>
</main>

</body>
</html>
