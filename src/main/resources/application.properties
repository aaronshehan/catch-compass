spring.application.name=catchcompass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Uploaded photos are written here, deliberately outside src/main/resources/static
# so they are never served as static content.
catchcompass.storage.photo-directory=./storage/photos

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Open-Meteo needs no API key. Timeouts are short on purpose: a slow weather
# service must never make logging a catch feel broken.
catchcompass.weather.forecast-url=https://api.open-meteo.com/v1/forecast
catchcompass.weather.archive-url=https://archive-api.open-meteo.com/v1/archive
catchcompass.weather.connect-timeout=3s
catchcompass.weather.read-timeout=5s

# Tailscale (and any reverse proxy) terminates HTTPS and forwards plain HTTP.
# Without this, Spring builds redirect URLs as http:// after saving a catch,
# which drops the phone out of the secure context and breaks geolocation.
server.forward-headers-strategy=framework
